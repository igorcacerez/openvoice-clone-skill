[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openvoice-clone-skill"
version = "0.1.0"
description = "Biblioteca local de vozes e narracao com OpenVoice e Piper"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
dependencies = ["numpy==1.26.4", "scipy==1.13.1", "librosa==0.10.2.post1", "soundfile==0.13.1", "silero-vad==6.2.3", "eng-to-ipa==0.0.2", "inflect==7.5.0", "Unidecode==1.3.8", "pypinyin==0.50.0", "cn2an==0.5.23", "jieba==0.42.1", "filelock==3.20.0"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
openvoice-skill = "openvoice_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: inferencia real, requer instalacao e modelos"]

[tool.ruff]
line-length = 110
